/notifications:
  get:
    tags: [Notifications]
    summary: 알림 목록 조회
    description: >
      내 알림을 최신순으로 무한 스크롤 조회합니다. 안 읽은 알림 수를 함께 반환합니다(헤더 알림 아이콘 표시용).
      첫 요청은 cursor 없이 보내고, 이후에는 직전 응답의 nextCursor를 그대로 보냅니다. nextCursor가 null이면 마지막 페이지입니다.
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: cursor
        description: 다음 페이지 위치. 직전 응답의 nextCursor를 그대로 사용 (첫 요청엔 생략)
        schema: { type: string }
        example: eyJpZCI6MzB9
      - in: query
        name: limit
        description: 한 번에 가져올 개수
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    responses:
      200:
        description: 조회 성공 (알림이 없으면 items는 빈 배열, unreadCount는 0)
        content:
          application/json:
            schema:
              type: object
              required: [items, nextCursor, unreadCount]
              properties:
                items:
                  type: array
                  description: 알림 목록 (최신순)
                  items:
                    type: object
                    required: [id, type, message, link, isRead, createdAt]
                    properties:
                      id: { type: integer, description: 알림 id, example: 31 }
                      type:
                        type: string
                        description: >
                          알림 종류. SIGNUP 가입 축하 / OFFER_RECEIVED 교환 제안 도착 / OFFER_ACCEPTED 교환 승인 /
                          OFFER_REJECTED 교환 거절 / PURCHASE_COMPLETED 구매 완료 / SALE_COMPLETED 판매 성사 /
                          SOLD_OUT 품절 / LISTING_UPDATED 판매글 수정
                        enum:
                          - SIGNUP
                          - OFFER_RECEIVED
                          - OFFER_ACCEPTED
                          - OFFER_REJECTED
                          - PURCHASE_COMPLETED
                          - SALE_COMPLETED
                          - SOLD_OUT
                          - LISTING_UPDATED
                        example: OFFER_RECEIVED
                      message:
                        type: string
                        description: 화면에 보여줄 문구
                        example: 티라임님이 [촬영 | 지금날씨]의 포토카드 교환을 제안했습니다.
                      link:
                        type: string
                        nullable: true
                        description: 눌렀을 때 이동할 화면
                        example: /marketplace/7
                      isRead: { type: boolean, description: 읽음 여부, example: false }
                      createdAt: { type: string, format: date-time, description: 알림 생성 시각, example: '2026-10-23T04:10:00.000Z' }
                nextCursor:
                  type: string
                  nullable: true
                  description: 다음 요청에 보낼 값. null이면 마지막 페이지
                  example: eyJpZCI6MzB9
                unreadCount: { type: integer, description: 안 읽은 알림 전체 개수, example: 3 }
      400:
        description: limit 범위 밖, 잘못된 cursor
      401:
        description: 로그인 안 함, 토큰 만료, 탈퇴한 계정

/notifications/{id}/read:
  patch:
    tags: [Notifications]
    summary: 알림 읽음 처리
    description: 알림 하나를 읽음으로 바꿉니다. 알림을 눌렀을 때 호출하며, 이미 읽은 알림이어도 성공합니다.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        description: 알림 id (내 알림만)
        schema: { type: integer, minimum: 1 }
        example: 31
    responses:
      200:
        description: 성공
      400:
        description: id가 숫자가 아님
      401:
        description: 로그인 안 함, 토큰 만료
      404:
        description: 없는 알림이거나 내 알림이 아님 (다른 사람 알림의 존재 여부를 알려 주지 않음)