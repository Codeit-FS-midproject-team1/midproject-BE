/photo-cards:
  post:
    tags: [PhotoCards]
    summary: 포토카드 생성
    description: 이미지와 카드 정보를 등록하고 발행 수만큼 카드를 생성합니다.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [image, name, method, genre, price, totalQuantity]
            properties:
              image:
                type: string
                format: binary
                description: 포토카드 이미지 파일 (JPG/JPEG, PNG, WebP, 10MB 이하)
              name:
                type: string
                minLength: 1
                maxLength: 15
                example: 우리집 앞마당
              description:
                type: string
                maxLength: 200
                example: 가을에 촬영한 풍경
              method:
                type: string
                enum: [PHOTO, CRAFT, AI, ETC]
              genre:
                type: string
                enum: [LANDSCAPE, PORTRAIT, ANIMAL, PLANT, OBJECT, ETC]
              price:
                type: integer
                minimum: 1
                maximum: 1000
                description: 기본 판매 가격 (P)
                example: 100
              totalQuantity:
                type: integer
                minimum: 1
                maximum: 10
                description: 발행 수량
                example: 5
    responses:
      201:
        description: 생성 성공
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, example: 101 }
                creatorId: { type: integer, example: 7 }
                name: { type: string, example: 우리집 앞마당 }
                description: { type: string, nullable: true, example: 가을에 촬영한 풍경 }
                method: { type: string, enum: [PHOTO, CRAFT, AI, ETC] }
                genre: { type: string, enum: [LANDSCAPE, PORTRAIT, ANIMAL, PLANT, OBJECT, ETC] }
                price: { type: integer, example: 100 }
                totalQuantity: { type: integer, example: 5 }
                imageUrl: { type: string, example: 'https://example.com/photo.png' }
                createdAt: { type: string, format: date-time, example: '2026-10-26T02:00:00.000Z' }
      400:
        description: 잘못된 요청값
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
            examples:
              imageRequired:
                summary: 이미지 없음
                value: { message: 이미지를 등록해주세요. }
              imageFormat:
                summary: 이미지 형식 오류
                value: { message: 'JPG, PNG, WebP 형식의 이미지만 등록할 수 있습니다.' }
              imageSize:
                summary: 이미지 크기 초과
                value: { message: 이미지 크기는 10MB 이하여야 합니다. }
              name:
                summary: 이름 길이 오류
                value: { message: 포토카드 이름은 15자 이하여야 합니다. }
              description:
                summary: 설명 길이 오류
                value: { message: 포토카드 설명은 200자 이하여야 합니다. }
              method:
                summary: 제작 방식 오류
                value: { message: 올바른 제작 방식을 선택해주세요. }
              genre:
                summary: 장르 오류
                value: { message: 올바른 장르를 선택해주세요. }
              price:
                summary: 가격 오류
                value: { message: 가격은 1~1000P 사이의 정수여야 합니다. }
              quantity:
                summary: 발행 수량 오류
                value: { message: 발행 수량은 1~10 사이의 정수여야 합니다. }
      401:
        description: 인증 실패
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, example: 인증이 필요합니다. }
      409:
        description: 이번 달 생성 횟수 초과
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, example: 이번 달 포토카드 생성 횟수를 초과했습니다. }