/sale-listings:
  get:
    tags: [SaleListings]
    summary: 마켓 목록 조회
    description: >
      마켓에 등록된 판매글 목록을 무한 스크롤로 조회합니다. 검색, 필터(한 번에 하나), 정렬을 지원하며
      취소된 판매글은 제외하고 품절은 포함합니다.
      첫 요청은 cursor 없이 보내고, 이후에는 직전 응답의 nextCursor를 그대로 보냅니다.
      nextCursor가 null이면 마지막 페이지입니다.
    parameters:
      - in: query
        name: keyword
        description: 카드 이름 검색 (부분 일치, 대소문자 무시). 필터와 함께 사용 가능
        schema: { type: string }
      - in: query
        name: method
        description: 제작 방식 필터 (method, genre, soldOut 중 하나만 사용)
        schema: { type: string, enum: [PHOTO, CRAFT, AI, ETC] }
      - in: query
        name: genre
        description: 장르 필터 (method, genre, soldOut 중 하나만 사용)
        schema: { type: string, enum: [LANDSCAPE, PORTRAIT, ANIMAL, PLANT, OBJECT, ETC] }
      - in: query
        name: soldOut
        description: 품절 여부 필터 (true 품절, false 판매 중) (method, genre, soldOut 중 하나만 사용)
        schema: { type: boolean }
      - in: query
        name: sort
        schema: { type: string, enum: [latest, oldest, priceLow, priceHigh], default: latest }
      - in: query
        name: cursor
        description: 다음 페이지 위치. 직전 응답의 nextCursor 값
        schema: { type: string }
      - in: query
        name: limit
        description: 한 번에 가져올 개수
        schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    responses:
      200:
        description: 조회 성공 (결과가 없으면 items는 빈 배열, nextCursor는 null)
        content:
          application/json:
            schema:
              type: object
              required: [items, nextCursor]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer, description: 판매글 id, example: 7 }
                      status: { type: string, enum: [ON_SALE, SOLD_OUT], example: ON_SALE }
                      price: { type: integer, description: 장당 가격 (1~1000P), example: 40 }
                      saleQuantity: { type: integer, description: 판매 등록 장수, example: 3 }
                      remainingQuantity: { type: integer, description: 남은 장수 (0이면 SOLD_OUT), example: 2 }
                      seller:
                        type: object
                        properties:
                          id: { type: integer, nullable: true, description: 탈퇴한 사용자면 null, example: 3 }
                          nickname: { type: string, description: 탈퇴한 사용자면 "탈퇴한 사용자", example: 포토러버 }
                      photoCard: { $ref: '#/components/schemas/PhotoCard' }
                      createdAt: { type: string, format: date-time, description: 판매글 등록 시각, example: '2026-10-21T09:00:00.000Z' }
                nextCursor:
                  type: string
                  nullable: true
                  description: 다음 요청에 보낼 값. null이면 마지막 페이지
                  example: eyJpZCI6N30
      400:
        description: 잘못된 요청값
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
            examples:
              multipleFilters:
                summary: 필터를 둘 이상 보냄
                value: { message: 필터는 한 번에 하나만 사용할 수 있습니다. }
              method:
                summary: 제작 방식 오류
                value: { message: 올바른 제작 방식을 선택해주세요. }
              genre:
                summary: 장르 오류
                value: { message: 올바른 장르를 선택해주세요. }
              soldOut:
                summary: 품절 필터 오류
                value: { message: 올바른 품절 여부를 선택해주세요. }
              sort:
                summary: 정렬 기준 오류
                value: { message: 올바른 정렬 기준을 선택해주세요. }
              limit:
                summary: limit 범위 오류
                value: { message: 한 번에 가져올 개수는 1~50 사이의 정수여야 합니다. }
              cursor:
                summary: 잘못된 cursor
                value: { message: 올바르지 않은 cursor입니다. }

/sale-listings/{id}/offers:
  get:
    tags: [Offers]
    summary: 교환 제안 목록 조회
    description: >
      특정 판매글의 대기 중인 교환 제안 목록을 조회합니다.
      판매자는 해당 판매글에 들어온 모든 대기 제안을, 그 외 사용자는 본인이 제시한 대기 제안만 조회할 수 있습니다.
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        description: 조회할 판매글 ID (sale_listings.id)
        schema: { type: integer, minimum: 1 }
        example: 7
    responses:
      200:
        description: 조회 성공 (제안이 없어도 200, 최신순)
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  description: 조회된 교환 제안 목록 (PENDING만 반환)
                  items:
                    type: object
                    properties:
                      id: { type: integer, example: 21 }
                      status: { type: string, example: PENDING }
                      description: { type: string, example: 이 카드랑 바꾸고 싶어요! }
                      photoCard: { $ref: '#/components/schemas/PhotoCard' }
                      offerer: { $ref: '#/components/schemas/UserSummary' }
                      createdAt: { type: string, format: date-time, example: '2026-10-26T06:00:00.000Z' }
      400:
        description: Path Parameter의 ID 형식 오류
      401:
        description: 로그인하지 않았거나 인증이 만료됨
      404:
        description: 조회 대상 판매글이 존재하지 않거나 취소된 경우
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, example: 판매글을 찾을 수 없습니다. }                